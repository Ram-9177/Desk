# ONE Desk behind nginx. Copy to /etc/nginx/sites-available/one-desk, link it into sites-enabled,
# then `sudo certbot --nginx -d stmarys-desk.supercxo.ai` adds HTTPS and the http → https redirect.
server {
    listen 80;
    listen [::]:80;
    server_name stmarys-desk.supercxo.ai;

    client_max_body_size 40m; # 5 photos per ticket, sent as base64 JSON

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
